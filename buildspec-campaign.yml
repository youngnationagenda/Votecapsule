version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 683541453923.dkr.ecr.us-east-1.amazonaws.com
      - export SHORT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "Building campaign-service SHA=$SHORT_SHA"
  build:
    commands:
      - docker build --build-arg SERVICE_PORT=3016 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t 683541453923.dkr.ecr.us-east-1.amazonaws.com/vote-capsule/campaign-service:$SHORT_SHA -t 683541453923.dkr.ecr.us-east-1.amazonaws.com/vote-capsule/campaign-service:latest -f services/campaign/Dockerfile . && docker push 683541453923.dkr.ecr.us-east-1.amazonaws.com/vote-capsule/campaign-service:$SHORT_SHA && docker push 683541453923.dkr.ecr.us-east-1.amazonaws.com/vote-capsule/campaign-service:latest && echo "CAMPAIGN_PUSHED" || echo "CAMPAIGN_FAILED"
  post_build:
    commands:
      - aws ecs update-service --cluster vote-capsule-services --service vc-campaign --force-new-deployment --region us-east-1 --output json --query "service.{Running:runningCount,Desired:desiredCount}" || true
      - echo "Campaign service rolling update triggered"
