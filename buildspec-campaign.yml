version: 0.2

# VoteCapsule - Campaign Service Rebuild
# Fixes: thumbnailUrl entity mapping, supplier tenant fallback,
#        suppliers bypass path in role guard

env:
  variables:
    AWS_REGION: "us-east-1"
    ECR_REGISTRY: "683541453923.dkr.ecr.us-east-1.amazonaws.com"

phases:
  install:
    commands:
      - echo "Campaign service rebuild - catalogue fix"
      - docker --version

  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - export SHORT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "SHA = $SHORT_SHA"

  build:
    commands:
      - echo "--- Building campaign-service ---"
      - docker build --build-arg SERVICE_PORT=3016 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION
          -t $ECR_REGISTRY/vote-capsule/campaign-service:$SHORT_SHA
          -t $ECR_REGISTRY/vote-capsule/campaign-service:latest
          -f services/campaign/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/campaign-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/campaign-service:latest
      - echo "DONE campaign-service"

  post_build:
    commands:
      - echo "=== Rolling vc-campaign ==="
      - aws ecs update-service --cluster vote-capsule-services --service vc-campaign --force-new-deployment --region $AWS_REGION || true
      - echo "=== Done ==="
