version: 0.2

# VoteCapsule — AWS CodeBuild Buildspec
# Builds all 12 Docker images (11 services + admin-web) and pushes to ECR

env:
  variables:
    AWS_REGION: "us-east-1"
    ECR_REGISTRY: "683541453923.dkr.ecr.us-east-1.amazonaws.com"
    AWS_ACCOUNT_ID: "683541453923"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== VoteCapsule Docker Build Pipeline ==="
      - echo "Build ID $CODEBUILD_BUILD_ID"
      - echo "Source commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - docker --version
      - aws --version

  pre_build:
    commands:
      - echo "=== Authenticating with ECR ==="
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - export SHORT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "Short SHA = $SHORT_SHA"

  build:
    commands:
      - echo "--- Building identity-service (port 3001) ---"
      - docker build --build-arg SERVICE_PORT=3001 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/identity-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/identity-service:latest -f services/identity/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/identity-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/identity-service:latest
      - echo "DONE identity-service"

      - echo "--- Building tenant-service (port 3002) ---"
      - docker build --build-arg SERVICE_PORT=3002 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/tenant-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/tenant-service:latest -f services/tenant/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/tenant-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/tenant-service:latest
      - echo "DONE tenant-service"

      - echo "--- Building trust-service (port 3003) ---"
      - docker build --build-arg SERVICE_PORT=3003 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/trust-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/trust-service:latest -f services/trust/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/trust-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/trust-service:latest
      - echo "DONE trust-service"

      - echo "--- Building geography-service (port 3004) ---"
      - docker build --build-arg SERVICE_PORT=3004 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/geography-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/geography-service:latest -f services/geography/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/geography-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/geography-service:latest
      - echo "DONE geography-service"

      - echo "--- Building evidence-service (port 3005) ---"
      - docker build --build-arg SERVICE_PORT=3005 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/evidence-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/evidence-service:latest -f services/evidence/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/evidence-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/evidence-service:latest
      - echo "DONE evidence-service"

      - echo "--- Building ai-service (port 3006) ---"
      - docker build --build-arg SERVICE_PORT=3006 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/ai-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/ai-service:latest -f services/ai/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/ai-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/ai-service:latest
      - echo "DONE ai-service"

      - echo "--- Building workflow-service (port 3007) ---"
      - docker build --build-arg SERVICE_PORT=3007 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/workflow-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/workflow-service:latest -f services/workflow/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/workflow-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/workflow-service:latest
      - echo "DONE workflow-service"

      - echo "--- Building notification-service (port 3008) ---"
      - docker build --build-arg SERVICE_PORT=3008 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/notification-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/notification-service:latest -f services/notification/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/notification-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/notification-service:latest
      - echo "DONE notification-service"

      - echo "--- Building candidate-service (port 3009) ---"
      - docker build --build-arg SERVICE_PORT=3009 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/candidate-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/candidate-service:latest -f services/candidate/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/candidate-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/candidate-service:latest
      - echo "DONE candidate-service"

      - echo "--- Building reporting-service (port 3010) ---"
      - docker build --build-arg SERVICE_PORT=3010 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/reporting-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/reporting-service:latest -f services/reporting/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/reporting-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/reporting-service:latest
      - echo "DONE reporting-service"

      - echo "--- Building election-service (port 3011) ---"
      - docker build --build-arg SERVICE_PORT=3011 --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/election-service:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/election-service:latest -f services/election/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/election-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/election-service:latest
      - echo "DONE election-service"

      - echo "--- Building admin-web ---"
      - docker build --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REGISTRY/vote-capsule/admin-web:$SHORT_SHA -t $ECR_REGISTRY/vote-capsule/admin-web:latest -f apps/admin-web/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/admin-web:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/admin-web:latest
      - echo "DONE admin-web"

  post_build:
    commands:
      - echo "=== All 12 images pushed to ECR ==="
      - echo "SHORT_SHA=$SHORT_SHA"
      - echo "--- ECR image summary ---"
      - aws ecr describe-images --repository-name vote-capsule/identity-service --image-ids imageTag=latest --region $AWS_REGION --query "imageDetails[0].{Digest:imageDigest,PushedAt:imagePushedAt}" --output table 2>/dev/null || echo "identity-service not yet available"
      - aws ecr describe-images --repository-name vote-capsule/geography-service --image-ids imageTag=latest --region $AWS_REGION --query "imageDetails[0].{Digest:imageDigest,PushedAt:imagePushedAt}" --output table 2>/dev/null || echo "geography-service not yet available"
      - aws ecr describe-images --repository-name vote-capsule/election-service --image-ids imageTag=latest --region $AWS_REGION --query "imageDetails[0].{Digest:imageDigest,PushedAt:imagePushedAt}" --output table 2>/dev/null || echo "election-service not yet available"
      - echo "=== VoteCapsule build pipeline complete ==="
