version: 0.2

# VoteCapsule — AWS CodeBuild Buildspec
# Builds all 15 Docker images (14 services + admin-web) and pushes to ECR
#
# BASE IMAGE STRATEGY (fixes 429 from public.ecr.aws):
#   All Dockerfiles use our private ECR Pull Through Cache:
#     683541453923.dkr.ecr.us-east-1.amazonaws.com/ecr-public/docker/library/node:22-alpine
#   This routes through the pull-through cache rule:
#     prefix=ecr-public → upstream=public.ecr.aws
#   First pull fetches from upstream + caches in our ECR.
#   All subsequent pulls (same build, other services) hit our ECR — no rate limits.
#
# LAYER CACHE STRATEGY:
#   Each service pulls its own :latest image from ECR before building,
#   so Docker can reuse unchanged layers (pnpm install, tsc, etc.).

env:
  variables:
    AWS_REGION: "us-east-1"
    ECR_REGISTRY: "683541453923.dkr.ecr.us-east-1.amazonaws.com"
    AWS_ACCOUNT_ID: "683541453923"
    # Pull-through cache base images (pulled once, reused across all service builds)
    NODE_ALPINE: "683541453923.dkr.ecr.us-east-1.amazonaws.com/ecr-public/docker/library/node:22-alpine"
    NODE_SLIM:   "683541453923.dkr.ecr.us-east-1.amazonaws.com/ecr-public/docker/library/node:22-slim"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== VoteCapsule Docker Build Pipeline ==="
      - echo "Build ID $CODEBUILD_BUILD_ID"
      - echo "Source commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - docker --version
      - aws --version

  pre_build:
    commands:
      - echo "=== Authenticating with ECR (private + pull-through cache) ==="
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - export SHORT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "Short SHA = $SHORT_SHA"

      # ── Pre-warm the pull-through cache base images ────────────────────────
      # This single pull fetches node:22-alpine from public.ecr.aws → stores
      # it in our private ECR pull-through cache. Every subsequent docker build
      # in this job (and future builds) hits our ECR instead of public.ecr.aws.
      # Prevents the 429 "Data limit exceeded" error on public.ecr.aws.
      - echo "=== Pre-warming ECR pull-through cache base images ==="
      - docker pull $NODE_ALPINE || echo "WARN node:22-alpine pull failed - will retry in build"
      - docker pull $NODE_SLIM   || echo "WARN node:22-slim pull failed - will retry in build"
      - echo "=== Base images cached in Docker layer store ==="

  build:
    commands:
      - |
        build_service() {
          local NAME=$1 PORT=$2 DOCKERFILE=$3
          echo "--- Building $NAME (port $PORT) ---"
          # Pull previous :latest for layer cache reuse (|| true = ok if first build)
          docker pull $ECR_REGISTRY/vote-capsule/$NAME:latest 2>/dev/null || true
          if docker build \
            --cache-from $ECR_REGISTRY/vote-capsule/$NAME:latest \
            --build-arg SERVICE_PORT=$PORT \
            --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION \
            -t $ECR_REGISTRY/vote-capsule/$NAME:$SHORT_SHA \
            -t $ECR_REGISTRY/vote-capsule/$NAME:latest \
            -f $DOCKERFILE . ; then
            docker push $ECR_REGISTRY/vote-capsule/$NAME:$SHORT_SHA
            docker push $ECR_REGISTRY/vote-capsule/$NAME:latest
            echo "DONE $NAME ✅"
          else
            echo "FAILED $NAME ❌ — continuing with remaining services"
          fi
        }

        build_service identity-service     3001 services/identity/Dockerfile
        build_service tenant-service       3002 services/tenant/Dockerfile
        build_service trust-service        3003 services/trust/Dockerfile
        build_service geography-service    3004 services/geography/Dockerfile
        build_service evidence-service     3005 services/evidence/Dockerfile
        build_service ai-service           3006 services/ai/Dockerfile
        build_service workflow-service     3007 services/workflow/Dockerfile
        build_service notification-service 3008 services/notification/Dockerfile
        build_service candidate-service    3009 services/candidate/Dockerfile
        build_service reporting-service    3010 services/reporting/Dockerfile
        build_service election-service     3011 services/election/Dockerfile
        build_service audit-service        3012 services/audit/Dockerfile
        build_service billing-service      3013 services/billing/Dockerfile
        build_service campaign-service     3016 services/campaign/Dockerfile

        echo "--- Building admin-web ---"
        docker pull $ECR_REGISTRY/vote-capsule/admin-web:latest 2>/dev/null || true
        if docker build \
          --cache-from $ECR_REGISTRY/vote-capsule/admin-web:latest \
          --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION \
          -t $ECR_REGISTRY/vote-capsule/admin-web:$SHORT_SHA \
          -t $ECR_REGISTRY/vote-capsule/admin-web:latest \
          -f apps/admin-web/Dockerfile . ; then
          docker push $ECR_REGISTRY/vote-capsule/admin-web:$SHORT_SHA
          docker push $ECR_REGISTRY/vote-capsule/admin-web:latest
          echo "DONE admin-web ✅"
        else
          echo "FAILED admin-web ❌"
        fi

  post_build:
    commands:
      - echo "=== Build pipeline complete. ECR image summary ==="
      - echo "SHORT_SHA=$SHORT_SHA"
      - |
        for SVC in identity-service tenant-service trust-service geography-service evidence-service ai-service workflow-service notification-service candidate-service reporting-service election-service audit-service billing-service campaign-service admin-web; do
          PUSHED=$(aws ecr describe-images --repository-name vote-capsule/$SVC --image-ids imageTag=latest --region $AWS_REGION --query "imageDetails[0].imagePushedAt" --output text 2>/dev/null || echo "NOT_PUSHED")
          echo "  $SVC: $PUSHED"
        done
      - echo "=== VoteCapsule build pipeline complete ==="
