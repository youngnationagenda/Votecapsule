name: Trigger AWS CodeBuild (Manual Fallback Only)

# ============================================================
# MANUAL FALLBACK ONLY — automatic builds are handled entirely
# by build-and-push-services.yml (GitHub Actions, 13 parallel
# jobs, correct port map, CVE gate, scanOnPush enforcement).
#
# Use this workflow only when you need to:
#   - Force a full sequential rebuild via CodeBuild (e.g. to
#     use BUILD_GENERAL1_LARGE memory for a heavy build)
#   - Target a specific git SHA or branch manually
#   - Diagnose a CodeBuild-specific issue
#
# The CodeBuild webhook has been REMOVED — CodeBuild no longer
# auto-fires on push. Only workflow_dispatch triggers it.
#
# History:
#   Was: push-triggered (services/**, packages/**, buildspec.yml)
#        + workflow_dispatch
#   Now: workflow_dispatch ONLY
#        The auto codebuild-push job has been removed to stop
#        triple-building (webhook + this job + build-and-push)
#        every commit.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'CodeBuild project name'
        required: false
        default: 'vote-capsule-docker-build'
      source_version:
        description: 'Git SHA or branch to build (leave empty for HEAD)'
        required: false
        default: ''
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual fallback build'

env:
  DEFAULT_PROJECT: vote-capsule-docker-build

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Manual build — polls CodeBuild until complete, prints CloudWatch log URL
  # ──────────────────────────────────────────────────────────────────────────
  codebuild-manual:
    name: CodeBuild (manual) — ${{ github.event.inputs.project_name || 'vote-capsule-docker-build' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-codebuild-manual-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      - name: Start CodeBuild project
        id: start
        run: |
          PROJECT="${{ github.event.inputs.project_name || env.DEFAULT_PROJECT }}"
          SOURCE="${{ github.event.inputs.source_version || github.sha }}"

          BUILD_ID=$(aws codebuild start-build \
            --project-name "$PROJECT" \
            --source-version "$SOURCE" \
            --region us-east-1 \
            --query 'build.id' \
            --output text)

          echo "build_id=${BUILD_ID}"   >> $GITHUB_OUTPUT
          echo "project=${PROJECT}"     >> $GITHUB_OUTPUT
          echo "▶️  Started CodeBuild build"
          echo "   Build ID : ${BUILD_ID}"
          echo "   Project  : ${PROJECT}"
          echo "   Source   : ${SOURCE}"
          echo "   Reason   : ${{ github.event.inputs.reason }}"

      - name: Poll until complete
        run: |
          BUILD_ID="${{ steps.start.outputs.build_id }}"
          echo "Polling build: ${BUILD_ID}"
          while true; do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "${BUILD_ID}" \
              --region us-east-1 \
              --query 'builds[0].buildStatus' \
              --output text)
            PHASE=$(aws codebuild batch-get-builds \
              --ids "${BUILD_ID}" \
              --region us-east-1 \
              --query 'builds[0].currentPhase' \
              --output text)
            echo "  → Status: ${STATUS}  Phase: ${PHASE}"
            case $STATUS in
              SUCCEEDED) echo "✅ Build SUCCEEDED"; exit 0 ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                echo "❌ Build ${STATUS}"
                exit 1
                ;;
              *) sleep 30 ;;
            esac
          done

      - name: Print CloudWatch log URL
        if: always()
        run: |
          BUILD_ID="${{ steps.start.outputs.build_id }}"
          PROJECT="${{ steps.start.outputs.project }}"
          echo ""
          echo "📋 CloudWatch Logs:"
          echo "   https://us-east-1.console.aws.amazon.com/codesuite/codebuild/683541453923/projects/${PROJECT}/build/${BUILD_ID}/log"
          echo ""
          echo "📋 CodeBuild Console:"
          echo "   https://us-east-1.console.aws.amazon.com/codesuite/codebuild/683541453923/projects/${PROJECT}/history"
