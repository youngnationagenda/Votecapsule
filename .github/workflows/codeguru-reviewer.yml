name: AWS CodeGuru Reviewer — Code Quality Analysis

# Renamed from codeguru_riviewer.yml (typo: "riviewer" → "reviewer")
# Fixed: Added S3 bucket creation step — codeguru-reviewer-vote-capsule-683541453923
# must exist before the reviewer action can store results. Without it the
# action fails silently with an S3 AccessDenied / NoSuchBucket error.
# NOTE: CodeGuru enforces that the bucket name must start with "codeguru-reviewer-".
#
# Step 2 additions:
#   - SARIF output uploaded to GitHub Code Scanning via
#     github/codeql-action/upload-sarif@v3 so findings appear inline on PRs
#     in the Security → Code scanning tab.
#   - S3 bucket step hardened: SSE-KMS bucket key now enforced on bucket
#     creation; lifecycle (90-day expiry) applied idempotently every run.

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/**'
      - 'packages/**'
  pull_request:
    branches:
      - master
      - main

jobs:
  codeguru-review:
    name: CodeGuru Security & Quality Review
    runs-on: ubuntu-latest
    permissions:
      id-token:        write   # OIDC token for AWS role assumption
      contents:        read    # Checkout source code
      security-events: write   # Upload SARIF to GitHub Code Scanning

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required by CodeGuru diff analysis

      # ── 2. AWS credentials via OIDC ──────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-codeguru-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      # ── 3. Ensure CodeGuru S3 bucket is ready ────────────────────────────────
      # CodeGuru stores review artifacts in S3 — bucket must exist, be private,
      # encrypted with SSE-KMS, and have a 90-day lifecycle rule before the
      # reviewer action runs.
      - name: Ensure CodeGuru S3 bucket exists and is hardened
        run: |
          BUCKET="codeguru-reviewer-vote-capsule-683541453923"
          REGION="us-east-1"

          # Create bucket if it does not exist yet
          if ! aws s3api head-bucket --bucket "$BUCKET" --region "$REGION" 2>/dev/null; then
            echo "Creating bucket $BUCKET …"
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --output json
          else
            echo "Bucket $BUCKET already exists — skipping creation."
          fi

          # Block all public access (idempotent)
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

          # Enforce SSE-KMS with bucket key (idempotent)
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"aws:kms"},"BucketKeyEnabled":true}]}'

          # 90-day lifecycle expiry for review artifacts (idempotent)
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "$BUCKET" \
            --lifecycle-configuration \
              '{"Rules":[{"ID":"ExpireCodeGuruReports","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":90},"NoncurrentVersionExpiration":{"NoncurrentDays":30}}]}'

          echo "✅ S3 bucket ready: $BUCKET"

      # ── 4. Run CodeGuru Reviewer ──────────────────────────────────────────────
      # The action analyses the diff, posts findings as PR annotations, and
      # writes a SARIF report to ./codeguru-results.sarif.gz
      - name: Run CodeGuru Reviewer
        id: codeguru
        uses: aws-actions/codeguru-reviewer@v1.1
        with:
          s3_bucket:   codeguru-reviewer-vote-capsule-683541453923
          source_path: .

      # ── 5. Upload SARIF to GitHub Code Scanning ───────────────────────────────
      # Findings appear inline on PRs in Security → Code scanning.
      # Runs even when CodeGuru finds issues (if: always()) so the SARIF
      # file is always uploaded regardless of the reviewer exit code.
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codeguru-results.sarif.gz
          category:   codeguru-reviewer
