name: AWS CodeGuru Reviewer — Code Quality Analysis

# Renamed from codeguru_riviewer.yml (typo: "riviewer" → "reviewer")
# Fixed: Added S3 bucket creation step — vote-capsule-codeguru-reviews-683541453923
# must exist before the reviewer action can store results. Without it the
# action fails silently with an S3 AccessDenied / NoSuchBucket error.

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/**'
      - 'packages/**'
  pull_request:
    branches:
      - master
      - main

jobs:
  codeguru-review:
    name: CodeGuru Security & Quality Review
    runs-on: ubuntu-latest
    permissions:
      id-token:        write
      contents:        read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required by CodeGuru diff analysis

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-codeguru-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      # CodeGuru stores review results in S3 — bucket must exist first
      - name: Ensure CodeGuru S3 bucket exists
        run: |
          BUCKET="vote-capsule-codeguru-reviews-683541453923"
          aws s3api head-bucket --bucket "$BUCKET" --region us-east-1 2>/dev/null || \
          aws s3api create-bucket \
            --bucket "$BUCKET" \
            --region us-east-1 \
            --output json
          # Block all public access
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          echo "✅ S3 bucket ready: $BUCKET"

      - name: Run CodeGuru Reviewer
        uses: aws-actions/codeguru-reviewer@v1.1
        with:
          s3_bucket:   vote-capsule-codeguru-reviews-683541453923
          source_path: .
