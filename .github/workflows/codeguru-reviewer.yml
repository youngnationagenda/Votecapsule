name: AWS CodeGuru Reviewer — Code Quality Analysis

# ── NOTE (2026-08) ──────────────────────────────────────────────────────────
# AWS CodeGuru Reviewer was shut down. The AssociateRepository API returns
# FeatureNoLongerAvailableException on all calls.
# Reference: https://docs.aws.amazon.com/codeguru/latest/reviewer-ug/codeguru-reviewer-availability-change.html
#
# This workflow is kept as a no-op stub so existing branch-protection rules
# that require this check name continue to pass. The actual security & quality
# analysis is now handled by:
#   • ESLint          — pr-quality-gate.yml > lint job
#   • TypeScript tsc  — pr-quality-gate.yml > typecheck job
#   • Gitleaks        — pr-quality-gate.yml > secret-scan job
#   • Unit tests      — pr-quality-gate.yml > unit-tests matrix
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/**'
      - 'packages/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  codeguru-review:
    name: CodeGuru Security & Quality Review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: CodeGuru Reviewer is discontinued — skipping
        run: |
          echo "ℹ️  AWS CodeGuru Reviewer was shut down in 2026."
          echo "   AssociateRepository API returns FeatureNoLongerAvailableException."
          echo "   Security & quality analysis is covered by ESLint, tsc, Gitleaks,"
          echo "   and vitest in the PR Quality Gate workflow."
          echo "✅ Step complete (no-op)."
