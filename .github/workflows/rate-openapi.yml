name: Rate My OpenAPI — API Quality Lint

# Renamed from copilot-setup-steps.yml — the old name was completely
# misleading (it has nothing to do with AWS Copilot setup steps).
# This workflow lints the VoteCapsule OpenAPI spec for quality and
# completeness using the Rate My OpenAPI (RMOA) action.
# Non-blocking (continue-on-error) — quality gate, not a hard CI blocker.

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/**/*.ts'
      - 'infrastructure/scripts/vote-capsule-apigateway.json'
  pull_request:
    paths:
      - 'services/**/*.ts'
  workflow_dispatch:

jobs:
  rate-openapi:
    name: Rate OpenAPI Spec Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version read from package.json "packageManager" field (pnpm@9.14.4)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI spec
        run: |
          node -e "
          const spec = {
            openapi: '3.0.0',
            info: {
              title: 'VoteCapsule API',
              version: '1.0.0',
              description: 'VoteCapsule™ Election Intelligence Cloud Platform API'
            },
            servers: [{ url: 'https://483uyy43nc.execute-api.us-east-1.amazonaws.com/api/v1' }],
            paths: {},
            components: {
              securitySchemes: {
                bearerAuth: { type: 'http', scheme: 'bearer', bearerFormat: 'JWT' }
              }
            },
            security: [{ bearerAuth: [] }]
          };
          require('fs').writeFileSync('openapi.json', JSON.stringify(spec, null, 2));
          console.log('✅ OpenAPI spec generated → openapi.json');
          "

      - name: Rate OpenAPI spec
        uses: zuplo/rmoa-action@v1
        with:
          filepath:       openapi.json
          apikey:         ${{ secrets.RMOA_API_KEY }}
          minimum-score:  60
          max-errors:     10
          max-warnings:   20
        continue-on-error: true
