name: AWS EC2 — Deploy GitHub Self-Hosted Runner

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action: deploy or destroy'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
      instance_type:
        description: 'EC2 instance type'
        required: false
        default: 't3.medium'

jobs:
  deploy-runner:
    name: Deploy GitHub Runner to EC2 (${{ github.event.inputs.action }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-ec2-runner-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Deploy GitHub Runner to EC2
        uses: bitovi/github-actions-deploy-github-runner-to-ec2@v0
        with:
          repo_url:           ${{ github.server_url }}/${{ github.repository }}
          repo_access_token:  ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          aws_default_region: us-east-1
          # Use existing VPC (us-east-1 default VPC — same as ECS cluster)
          aws_vpc_id:         vpc-0ae6f8630af9fbfdc
          # Deploy in us-east-1a (ALB-enabled subnet)
          aws_vpc_subnet_id:  subnet-0171d821c5d5ae868
          ec2_instance_type:  ${{ github.event.inputs.instance_type || 't3.medium' }}
          aws_ec2_ami_filter: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
          aws_ec2_ami_owner:  099720109477
          aws_resource_identifier: vote-capsule-runner
          tf_stack_destroy:   ${{ github.event.inputs.action == 'destroy' }}
          aws_additional_tags: '{"Project":"vote-capsule","ManagedBy":"github-actions"}'
          aws_ec2_port_list:  '[22]'
