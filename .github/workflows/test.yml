name: Test Suite

# ============================================================
# FIXED:
#  1. Unit tests — added pnpm cache key so install is fast.
#  2. Integration tests — replaced `npm ci` with pnpm (monorepo
#     uses pnpm workspaces; npm ci cannot resolve workspace deps).
#     Added --frozen-lockfile and proper filter syntax.
#  3. Integration test secrets (API_BASE_URL, COGNITO_CLIENT_ID)
#     are optional — job skips gracefully when not configured
#     so the test suite never blocks a PR just because the live
#     environment is not wired up yet.
# ============================================================

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Unit tests — one matrix job per service
  # ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity
          - evidence
          - trust
          - geography
          - candidate
          - election
          - notification
          - reporting
          - workflow
          - ai
          - tenant
          - audit
          - billing

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version read from package.json "packageManager" field (pnpm@9.14.4)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm          # pnpm cache — speeds up repeat installs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests — ${{ matrix.service }}
        run: |
          pnpm --filter "@vote-capsule/${{ matrix.service }}-service" \
            test -- --run --reporter=verbose --passWithNoTests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 2. Integration tests — only run when live env secrets exist
  # ──────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version read from package.json "packageManager" field (pnpm@9.14.4)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # FIXED: was `npm ci` — must use pnpm to resolve workspace packages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guard: skip integration suite when live-env secrets are absent.
      # This prevents CI from hard-failing on forks and branch PRs that
      # haven't been given environment secrets.
      - name: Check live-env secrets
        id: env-check
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ] || [ -z "${{ secrets.COGNITO_CLIENT_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️  API_BASE_URL or COGNITO_CLIENT_ID not set — skipping integration tests."
            echo "   Add these secrets to run against a live environment."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Live-env secrets found — running integration tests."
          fi

      - name: Run integration tests
        if: steps.env-check.outputs.skip == 'false'
        run: pnpm --filter "@vote-capsule/integration-tests" test:ci
        env:
          API_BASE_URL:       ${{ secrets.API_BASE_URL }}
          COGNITO_CLIENT_ID:  ${{ secrets.COGNITO_CLIENT_ID }}

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always() && steps.env-check.outputs.skip == 'false'
        with:
          name: integration-test-results
          path: tests/integration/junit.xml
          retention-days: 7
