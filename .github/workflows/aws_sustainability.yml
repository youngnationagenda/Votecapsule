name: AWS Sustainability Scanner — CloudFormation Templates

# ============================================================
# FIXED: Added `continue-on-error: true` to live-stack scan
# steps. Both VoteCapsuleComputeStack and VoteCapsuleECSPhase7Stack
# may not exist in every environment / branch. Without the guard
# the entire job would hard-fail with "Stack not found", blocking
# PRs. File-based scan step is always safe and kept strict.
# ============================================================

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'infrastructure/scripts/*.json'
      - 'infrastructure/cdk/**'
  pull_request:
    paths:
      - 'infrastructure/scripts/*.json'
      - 'infrastructure/cdk/**'
  workflow_dispatch:

jobs:
  sustainability-scan:
    name: Scan CloudFormation Templates for Sustainability
    runs-on: ubuntu-latest
    permissions:
      id-token:        write
      contents:        read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-sustainability-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      # File-based scan — always safe; fail the job if templates are bad
      - name: Scan local CloudFormation templates
        uses: aws-actions/sustainability-scanner@v1
        with:
          directory: infrastructure/scripts

      # Live-stack scans — stacks may not exist in all branches/envs;
      # FIXED: continue-on-error so a missing stack doesn't kill the job
      - name: Scan VoteCapsuleComputeStack (live)
        uses: aws-actions/sustainability-scanner@v1
        continue-on-error: true
        with:
          stack_name: VoteCapsuleComputeStack

      - name: Scan VoteCapsuleECSPhase7Stack (live)
        uses: aws-actions/sustainability-scanner@v1
        continue-on-error: true
        with:
          stack_name: VoteCapsuleECSPhase7Stack
