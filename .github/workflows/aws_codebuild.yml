name: AWS CodeBuild — Run Build Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'CodeBuild project name'
        required: false
        default: 'vote-capsule-docker-build'
      source_version:
        description: 'Git SHA or branch to build (leave empty for HEAD)'
        required: false
        default: ''

  push:
    branches:
      - master
      - main
    paths:
      - 'services/**'
      - 'packages/**'
      - 'buildspec.yml'

jobs:
  run-codebuild:
    name: Trigger CodeBuild — ${{ github.event.inputs.project_name || 'vote-capsule-docker-build' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-codebuild-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Run CodeBuild project
        uses: aws-actions/aws-codebuild-run-build@v1.0.19
        with:
          project-name: ${{ github.event.inputs.project_name || 'vote-capsule-docker-build' }}
          source-version-override: ${{ github.event.inputs.source_version || github.sha }}
          env-vars-for-codebuild: |
            GITHUB_SHA,
            GITHUB_REF,
            GITHUB_REPOSITORY
        env:
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_REF:        ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
