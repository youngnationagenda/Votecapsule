name: Build & Push Service Images to ECR

# ============================================================
# FIXED: Migrated from static AWS key secrets (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY) to OIDC role assumption — consistent
# with every other workflow in this repo. No repo secrets needed
# for AWS auth.
# ============================================================

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/**'
      - 'packages/**'

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (e.g. identity, geography). Leave empty for all.'
        required: false
        default: ''

env:
  AWS_REGION:    us-east-1
  ECR_REGISTRY:  683541453923.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build & Push — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: identity
            dir:  services/identity
            repo: vote-capsule/identity-service
            port: 3001
          - name: evidence
            dir:  services/evidence
            repo: vote-capsule/evidence-service
            port: 3002
          - name: trust
            dir:  services/trust
            repo: vote-capsule/trust-service
            port: 3003
          - name: geography
            dir:  services/geography
            repo: vote-capsule/geography-service
            port: 3004
          - name: candidate
            dir:  services/candidate
            repo: vote-capsule/candidate-service
            port: 3005
          - name: election
            dir:  services/election
            repo: vote-capsule/election-service
            port: 3006
          - name: notification
            dir:  services/notification
            repo: vote-capsule/notification-service
            port: 3007
          - name: reporting
            dir:  services/reporting
            repo: vote-capsule/reporting-service
            port: 3008
          - name: workflow
            dir:  services/workflow
            repo: vote-capsule/workflow-service
            port: 3009
          - name: ai
            dir:  services/ai
            repo: vote-capsule/ai-service
            port: 3010
          - name: tenant
            dir:  services/tenant
            repo: vote-capsule/tenant-service
            port: 3011
          - name: audit
            dir:  services/audit
            repo: vote-capsule/audit-service
            port: 3012
          - name: billing
            dir:  services/billing
            repo: vote-capsule/billing-service
            port: 3013

    steps:
      # Skip matrix entry when a specific service is requested via workflow_dispatch
      - name: Skip if specific service requested and this is not it
        if: github.event.inputs.service != '' && github.event.inputs.service != matrix.service.name
        run: echo "Skipping ${{ matrix.service.name }}" && exit 0

      - uses: actions/checkout@v4

      # ── FIXED: OIDC auth — no static keys required ──────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-ecr-${{ matrix.service.name }}-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE_TAG="${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}"                                                            >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}"                                                            >> $GITHUB_OUTPUT
          echo "image_uri=${ECR_REGISTRY}/${{ matrix.service.repo }}:${IMAGE_TAG}"                >> $GITHUB_OUTPUT
          echo "latest_uri=${ECR_REGISTRY}/${{ matrix.service.repo }}:latest"                     >> $GITHUB_OUTPUT

      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ matrix.service.repo }}" \
            --region us-east-1 \
            --output json > /dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ matrix.service.repo }}" \
            --region us-east-1 \
            --image-scanning-configuration scanOnPush=true \
            --output json
          echo "✅ ECR repository ready: ${{ matrix.service.repo }}"

      - name: Build Docker image — ${{ matrix.service.name }}
        run: |
          docker build \
            --build-arg SERVICE_PORT=${{ matrix.service.port }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t "${{ steps.tags.outputs.image_uri }}" \
            -t "${{ steps.tags.outputs.latest_uri }}" \
            -f "${{ matrix.service.dir }}/Dockerfile" \
            .

      - name: Push to ECR — ${{ matrix.service.name }}
        run: |
          docker push "${{ steps.tags.outputs.image_uri }}"
          docker push "${{ steps.tags.outputs.latest_uri }}"
          echo "✅ Pushed: ${{ steps.tags.outputs.image_uri }}"
          echo "✅ Pushed: ${{ steps.tags.outputs.latest_uri }}"

      - name: Output image digest
        run: |
          aws ecr describe-images \
            --repository-name "${{ matrix.service.repo }}" \
            --image-ids imageTag=${{ steps.tags.outputs.image_tag }} \
            --region us-east-1 \
            --query 'imageDetails[0].{Digest:imageDigest,PushedAt:imagePushedAt,SizeBytes:imageSizeInBytes}' \
            --output table
