name: Build & Push Service Images to ECR

# ============================================================
# Triggered on every push to master/main that touches services
# or packages, and on manual workflow_dispatch for a single
# service or all services.
#
# Auth:   OIDC — no static AWS keys in repo secrets.
# Images: tagged with short SHA (8 chars) + :latest
# ECR:    repositories auto-created if missing, scanOnPush=true
#         enforced idempotently on every run.
#
# Port map (canonical — matches Dockerfile ARG SERVICE_PORT):
#   identity     3001    evidence     3002    trust        3003
#   geography    3004    candidate    3005    election     3006
#   notification 3007    workflow     3008    reporting    3009
#   ai           3010    tenant       3011    audit        3012
#   billing      3013
# ============================================================

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/**'
      - 'packages/**'

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (e.g. identity, geography). Leave empty to build all.'
        required: false
        default: ''
      no_cache:
        description: 'Disable Docker layer cache (true/false)'
        required: false
        default: 'false'

env:
  AWS_REGION:   us-east-1
  ECR_REGISTRY: 683541453923.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build & Push — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC role assumption
      contents: read

    strategy:
      fail-fast: false   # Build all services even if one fails
      matrix:
        service:
          - { name: identity,     dir: services/identity,     repo: vote-capsule/identity-service,     port: 3001 }
          - { name: evidence,     dir: services/evidence,     repo: vote-capsule/evidence-service,     port: 3002 }
          - { name: trust,        dir: services/trust,        repo: vote-capsule/trust-service,        port: 3003 }
          - { name: geography,    dir: services/geography,    repo: vote-capsule/geography-service,    port: 3004 }
          - { name: candidate,    dir: services/candidate,    repo: vote-capsule/candidate-service,    port: 3005 }
          - { name: election,     dir: services/election,     repo: vote-capsule/election-service,     port: 3006 }
          - { name: notification, dir: services/notification, repo: vote-capsule/notification-service, port: 3007 }
          - { name: workflow,     dir: services/workflow,     repo: vote-capsule/workflow-service,     port: 3008 }
          - { name: reporting,    dir: services/reporting,    repo: vote-capsule/reporting-service,    port: 3009 }
          - { name: ai,           dir: services/ai,           repo: vote-capsule/ai-service,           port: 3010 }
          - { name: tenant,       dir: services/tenant,       repo: vote-capsule/tenant-service,       port: 3011 }
          - { name: audit,        dir: services/audit,        repo: vote-capsule/audit-service,        port: 3012 }
          - { name: billing,      dir: services/billing,      repo: vote-capsule/billing-service,      port: 3013 }

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Skip if a specific service was requested and this is not it ───────
      # FIX: use `continue` pattern via job-level `if:` on subsequent steps
      # instead of `exit 0` inside a step (which fails the job, not skips it).
      # We gate every downstream step with this condition instead.
      - name: Check if this service should be skipped
        id: should_run
        run: |
          REQUESTED="${{ github.event.inputs.service }}"
          THIS="${{ matrix.service.name }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$THIS" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping $THIS — only building $REQUESTED"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "▶️  Building $THIS"
          fi

      # ── 3. AWS credentials via OIDC ──────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        if: steps.should_run.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-ecr-${{ matrix.service.name }}-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      # ── 4. Login to ECR ──────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        if: steps.should_run.outputs.skip != 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── 5. Resolve image tags ─────────────────────────────────────────────────
      - name: Set image tags
        if: steps.should_run.outputs.skip != 'true'
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "short_sha=${SHORT_SHA}"                                                            >> $GITHUB_OUTPUT
          echo "image_tag=${SHORT_SHA}"                                                            >> $GITHUB_OUTPUT
          echo "image_uri=${ECR_REGISTRY}/${{ matrix.service.repo }}:${SHORT_SHA}"                >> $GITHUB_OUTPUT
          echo "latest_uri=${ECR_REGISTRY}/${{ matrix.service.repo }}:latest"                     >> $GITHUB_OUTPUT

      # ── 6. Ensure ECR repository exists with scanOnPush=true ─────────────────
      - name: Ensure ECR repository exists
        if: steps.should_run.outputs.skip != 'true'
        run: |
          REPO="${{ matrix.service.repo }}"

          if aws ecr describe-repositories \
               --repository-names "$REPO" \
               --region us-east-1 \
               --output json > /dev/null 2>&1; then
            echo "✅ ECR repository exists: $REPO"
          else
            echo "ℹ️  Creating ECR repository: $REPO"
            aws ecr create-repository \
              --repository-name "$REPO" \
              --region us-east-1 \
              --image-scanning-configuration scanOnPush=true \
              --output json
            echo "✅ Created: $REPO"
          fi

          # Idempotently enforce scanOnPush=true on every run
          aws ecr put-image-scanning-configuration \
            --repository-name "$REPO" \
            --image-scanning-configuration scanOnPush=true \
            --region us-east-1 \
            --output json > /dev/null
          echo "✅ scanOnPush=true enforced: $REPO"

      # ── 7. Build Docker image ─────────────────────────────────────────────────
      - name: Build Docker image — ${{ matrix.service.name }}
        if: steps.should_run.outputs.skip != 'true'
        run: |
          NO_CACHE_FLAG=""
          if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            NO_CACHE_FLAG="--no-cache"
            echo "ℹ️  Building without Docker layer cache"
          fi

          docker build $NO_CACHE_FLAG \
            --build-arg SERVICE_PORT=${{ matrix.service.port }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t "${{ steps.tags.outputs.image_uri }}" \
            -t "${{ steps.tags.outputs.latest_uri }}" \
            -f "${{ matrix.service.dir }}/Dockerfile" \
            .

      # ── 8. Push to ECR ────────────────────────────────────────────────────────
      - name: Push to ECR — ${{ matrix.service.name }}
        if: steps.should_run.outputs.skip != 'true'
        run: |
          docker push "${{ steps.tags.outputs.image_uri }}"
          docker push "${{ steps.tags.outputs.latest_uri }}"
          echo "✅ Pushed: ${{ steps.tags.outputs.image_uri }}"
          echo "✅ Pushed: ${{ steps.tags.outputs.latest_uri }}"

      # ── 9. Report: digest + scan summary ─────────────────────────────────────
      - name: Image digest & scan summary — ${{ matrix.service.name }}
        if: steps.should_run.outputs.skip != 'true'
        run: |
          REPO="${{ matrix.service.repo }}"
          TAG="${{ steps.tags.outputs.image_tag }}"

          echo "──────────────────────────────────────────────"
          echo "  Service : ${{ matrix.service.name }}"
          echo "  SHA tag : $TAG"
          echo "──────────────────────────────────────────────"

          # Image metadata
          aws ecr describe-images \
            --repository-name "$REPO" \
            --image-ids imageTag="$TAG" \
            --region us-east-1 \
            --query 'imageDetails[0].{Digest:imageDigest,PushedAt:imagePushedAt,SizeMB:imageSizeInBytes}' \
            --output table

          # Wait briefly for scan to start, then print severity summary
          sleep 10
          SCAN=$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" \
            --image-id imageTag="$TAG" \
            --region us-east-1 \
            --query '{Status:imageScanStatus.status,Findings:imageScanFindings.findingSeverityCounts}' \
            --output json 2>/dev/null || echo '{"Status":"PENDING","Findings":{}}')

          echo "Scan result: $SCAN"

          # Fail the step if any CRITICAL or HIGH CVEs are found
          CRITICAL=$(echo "$SCAN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Findings',{}).get('CRITICAL',0))" 2>/dev/null || echo 0)
          HIGH=$(echo "$SCAN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Findings',{}).get('HIGH',0))" 2>/dev/null || echo 0)

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ CRITICAL=$CRITICAL HIGH=$HIGH CVEs found in $REPO:$TAG — blocking push"
            exit 1
          fi

          echo "✅ Scan clean — CRITICAL=0 HIGH=0"
