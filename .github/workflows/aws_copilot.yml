name: AWS Copilot — Deploy Service

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Copilot command'
        required: true
        default: 'svc deploy'
      app:
        description: 'Application name'
        required: false
        default: 'vote-capsule'
      env:
        description: 'Environment name'
        required: false
        default: 'production'
      service:
        description: 'Service name (e.g. identity, evidence)'
        required: false
        default: ''

jobs:
  copilot-deploy:
    name: AWS Copilot — ${{ github.event.inputs.command }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-copilot-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Run AWS Copilot command
        uses: ksivamuthu/aws-copilot-github-action@v0.0.8
        with:
          command: ${{ github.event.inputs.command }}
          app:     ${{ github.event.inputs.app }}
          env:     ${{ github.event.inputs.env }}
          name:    ${{ github.event.inputs.service }}
          tag:     ${{ github.sha }}
