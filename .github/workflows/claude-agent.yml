# ============================================================
# VoteCapsule™ — Claude Code GitHub Action (AWS Bedrock)
# .github/workflows/claude-agent.yml
#
# FIXED: Replaced ANTHROPIC_API_KEY (direct Anthropic API key
# that was never set) with AWS Bedrock via OIDC role assumption.
#
# How it works:
#   - GitHub Actions assumes `vote-capsule-github-actions-role`
#     via OIDC (same role used by every other workflow).
#   - That role now has bedrock:InvokeModel permission (added
#     to the inline policy github-actions-ecr-ecs-s3).
#   - The claude-code-action is pointed at the Bedrock provider
#     using the US cross-region inference profile for Claude
#     Sonnet 4.5 — the latest stable Sonnet available in this
#     account's us-east-1 region.
#   - Zero new secrets required — fully secretless AWS auth.
#
# Model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
#   (US cross-region inference profile — best latency + availability)
#
# Usage: Comment "@claude <instruction>" on any PR or issue.
# ============================================================
name: Claude Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when @claude is mentioned in a comment or issue body
    if: |
      (github.event_name == 'issue_comment'              && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues'                     && contains(github.event.issue.body,    '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents:      write
      pull-requests: write
      issues:        write
      id-token:      write   # Required for OIDC → Bedrock

    steps:
      # ── Step 1: Assume the OIDC role (gives Bedrock access) ────────────────
      - name: Configure AWS credentials (OIDC → Bedrock)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-claude-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      # ── Step 2: Run Claude via Bedrock ─────────────────────────────────────
      - name: Run Claude Code (Bedrock)
        uses: anthropics/claude-code-action@v1
        with:
          # Bedrock provider — uses the AWS credentials from the step above.
          # No ANTHROPIC_API_KEY needed.
          use_bedrock: "true"

          # US cross-region inference profile for Claude Sonnet 4.5
          # (latest stable Sonnet in this account; routes across US regions
          # for best availability and lowest latency)
          model: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"

          timeout_minutes: 30

          # VoteCapsule project context injected into every Claude session
          custom_instructions: |
            You are the CTO AI agent for VoteCapsule™, an Election Intelligence Cloud Platform
            targeting Kenya's 2027 General Election.

            ## Architecture
            - 13 NestJS microservices (ports 3001-3013): identity, evidence, trust, geography,
              candidate, election, notification, reporting, workflow, ai, tenant, audit, billing
            - 6 React+Vite web portals: admin, authority, party, candidate, observer, public
            - 2 React Native/Expo mobile apps: agent-mobile, validator-mobile
            - Monorepo: pnpm workspaces + turbo
            - DB: Aurora PostgreSQL 16.8 Serverless v2 (TypeORM)
            - AWS: ECS Fargate, ALB, API Gateway HTTP v2, CloudFront, S3, OpenSearch, ElastiCache Redis
            - Auth: Cognito User Pool + JWT (InitiateAuth — NOT hosted UI)
            - Trust: Hedera Consensus Service + RFC 3161 (NO blockchain, NO smart contracts)
            - AI: AWS Bedrock (Claude Sonnet 4.5 via us-east-1 inference profile)

            ## Critical Rules — NEVER violate:
            - SHA-256 formula LOCKED: SHA-256(imageSHA256 + sortedMetadataJSON + captureTimestamp)
            - User-facing trust language: "Integrity Verified" — NEVER say "blockchain"
            - NEC is Single Source of Truth for geography — never duplicate station data
            - Evidence is immutable after dual-anchor confirmation (Hedera + RFC 3161)
            - DB credentials in AWS Secrets Manager ONLY — never in code or env files
            - No smart contracts anywhere in the platform
            - Never commit firebase-service-account.json

            ## Monorepo Layout
            ```
            vote-capsule/
            ├── services/             # 13 NestJS microservices
            ├── apps/                 # 6 web portals + 2 mobile apps
            ├── packages/             # shared: types, design-tokens, test-utils
            ├── infrastructure/       # CDK, step-functions, scripts
            ├── database/migrations/  # 128 SQL migrations
            └── tests/integration/    # Cross-service integration tests
            ```

            ## Key Lifecycle Patterns
            - Capsule: DRAFT → CAPTURED → QUEUED → UPLOADING → UPLOADED → APPROVED → ANCHORED → PUBLISHED
            - Form chain: Form A (station) → Form B (constituency) → Form C (county/national)
            - Reconciliation: SUM(Form As) == Form B, SUM(Form Bs) == Form C
            - AI routing: AUTO_APPROVE (>0.85), HUMAN_REVIEW (0.6-0.85), ESCALATE (<0.6)

            ## When fixing code:
            - Run `pnpm install` first
            - Run tests: `cd services/<name> && pnpm test`
            - Lint: `pnpm lint`
            - Type-check: `pnpm tsc --noEmit`
            - Never modify database migrations that have already been applied

          # Tools Claude is permitted to use
          allowed_tools: "bash,read,write,edit"
