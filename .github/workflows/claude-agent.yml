# ============================================================
# VoteCapsule™ — Claude Code GitHub Action (AWS Bedrock)
# .github/workflows/claude-agent.yml
#
# Trigger : comment "@claude <instruction>" on any PR or issue
# Model   : us.anthropic.claude-sonnet-4-5-20250929-v1:0
# Auth    : AWS Bedrock via OIDC — zero repo secrets needed
#
# Project knowledge (tech stack, services, critical rules, etc.)
# lives entirely in CLAUDE.md at the repo root. Claude Code reads
# that file automatically on every run. custom_instructions here
# contains ONLY workflow-specific behaviour rules that are not
# appropriate for CLAUDE.md (permissions, tool limits, CI etiquette).
# ============================================================
name: Claude Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment'               && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues'                      && contains(github.event.issue.body,   '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents:      write
      pull-requests: write
      issues:        write
      id-token:      write   # Required for OIDC → Bedrock

    steps:
      - name: Configure AWS credentials (OIDC → Bedrock)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-claude-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      - name: Run Claude Code (Bedrock)
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock:     "true"
          model:           "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
          timeout_minutes: 30

          # ── Workflow-specific behaviour only ──────────────────────────────
          # Project knowledge (stack, services, ports, critical rules, DB
          # layout, lifecycle patterns) is in CLAUDE.md at the repo root.
          # Claude Code reads that file automatically — do not duplicate it here.
          # ──────────────────────────────────────────────────────────────────
          custom_instructions: |
            ## How to respond in GitHub
            - Always reply in the same PR comment thread or issue that triggered you.
            - Prefix every reply with a one-line summary of what you did or decided.
            - If you cannot complete a task safely, explain why and suggest the next step.
            - Never force-push. Never rebase shared branches. Create new commits only.

            ## Code change rules
            - Run `pnpm install --frozen-lockfile` before making any code changes.
            - After changes, run the affected service tests: `cd services/<name> && pnpm test`.
            - Run `pnpm lint` and `pnpm tsc --noEmit` before committing.
            - Never edit files in `database/migrations/` — migrations are immutable once applied.
            - Never commit secrets, `.env` files, or `firebase-service-account.json`.

            ## Scope limits
            - Only modify files relevant to the requested task.
            - Do not refactor unrelated code in the same commit.
            - Do not change `pnpm-lock.yaml` unless explicitly asked to update dependencies.

          allowed_tools: "bash,read,write,edit"
