name: Build Mobile Apps (EAS)

# ============================================================
# FIXED: Added EXPO_TOKEN guard step before EAS CLI setup.
# If the secret is not set the job now exits with a clear
# message instead of silently failing inside the EAS action.
# ============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'apps/agent-mobile/**'
      - 'apps/validator-mobile/**'
      - 'packages/**'

  pull_request:
    branches:
      - main
    paths:
      - 'apps/agent-mobile/**'
      - 'apps/validator-mobile/**'
      - 'packages/**'

  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        type: choice
        options:
          - agent
          - validator
          - both
        default: both
      profile:
        description: 'EAS build profile'
        required: true
        type: choice
        options:
          - development
          - preview
          - production
        default: preview

env:
  EAS_PROJECT_ID: 969c7ec4-865c-41f2-b4b4-d01f1409d2a8
  EAS_OWNER:      ynakenya
  NODE_VERSION:   '22'
  PNPM_VERSION:   '9'

jobs:
  # ──────────────────────────────────────────────────────────
  # Agent Mobile Build
  # ──────────────────────────────────────────────────────────
  build-agent:
    name: Build Agent Mobile (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.app == 'agent' || github.event.inputs.app == 'both'))
    defaults:
      run:
        working-directory: apps/agent-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # FIXED: guard against missing EXPO_TOKEN before EAS CLI setup.
      # Without this the expo-github-action step fails with a cryptic
      # auth error rather than a clear "secret not set" message.
      - name: Verify EXPO_TOKEN is set
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EXPO_TOKEN secret is not set in this repository."
            echo "   Go to Settings → Secrets → Actions and add EXPO_TOKEN."
            exit 1
          fi
          echo "✅ EXPO_TOKEN is present."

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            echo "name=preview" >> $GITHUB_OUTPUT
          fi

      - name: Run EAS Build — Agent Mobile
        id: eas-build
        run: |
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.name }} \
            --non-interactive \
            --no-wait \
            --json 2>&1 | tail -1)
          echo "build_output=${BUILD_OUTPUT}" >> $GITHUB_OUTPUT
          BUILD_ID=$(echo "${BUILD_OUTPUT}" | jq -r '.[0].id // empty')
          BUILD_URL="https://expo.dev/accounts/${EAS_OWNER}/projects/votecapsule-agent/builds/${BUILD_ID}"
          echo "build_id=${BUILD_ID}"   >> $GITHUB_OUTPUT
          echo "build_url=${BUILD_URL}" >> $GITHUB_OUTPUT
          echo "## Agent Mobile Build Submitted"               >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** ${{ steps.profile.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** ${BUILD_ID}"                   >> $GITHUB_STEP_SUMMARY
          echo "- **Build URL:** ${BUILD_URL}"                 >> $GITHUB_STEP_SUMMARY
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Comment build URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = '${{ steps.eas-build.outputs.build_url }}';
            const profile  = '${{ steps.profile.outputs.name }}';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: `### Agent Mobile Build Submitted\n\n| Field | Value |\n|-------|-------|\n| **App** | VoteCapsule Agent |\n| **Profile** | ${profile} |\n| **Platform** | Android |\n| **Build URL** | ${buildUrl} |\n\n_Build started via EAS. Check the link above for status and artifacts._`
            });

  # ──────────────────────────────────────────────────────────
  # Validator Mobile Build
  # ──────────────────────────────────────────────────────────
  build-validator:
    name: Build Validator Mobile (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.app == 'validator' || github.event.inputs.app == 'both'))
    defaults:
      run:
        working-directory: apps/validator-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # FIXED: guard against missing EXPO_TOKEN
      - name: Verify EXPO_TOKEN is set
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EXPO_TOKEN secret is not set in this repository."
            echo "   Go to Settings → Secrets → Actions and add EXPO_TOKEN."
            exit 1
          fi
          echo "✅ EXPO_TOKEN is present."

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            echo "name=preview" >> $GITHUB_OUTPUT
          fi

      - name: Run EAS Build — Validator Mobile
        id: eas-build
        run: |
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.name }} \
            --non-interactive \
            --no-wait \
            --json 2>&1 | tail -1)
          echo "build_output=${BUILD_OUTPUT}" >> $GITHUB_OUTPUT
          BUILD_ID=$(echo "${BUILD_OUTPUT}" | jq -r '.[0].id // empty')
          BUILD_URL="https://expo.dev/accounts/${EAS_OWNER}/projects/votecapsule-validator/builds/${BUILD_ID}"
          echo "build_id=${BUILD_ID}"   >> $GITHUB_OUTPUT
          echo "build_url=${BUILD_URL}" >> $GITHUB_OUTPUT
          echo "## Validator Mobile Build Submitted"               >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** ${{ steps.profile.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** ${BUILD_ID}"                      >> $GITHUB_STEP_SUMMARY
          echo "- **Build URL:** ${BUILD_URL}"                    >> $GITHUB_STEP_SUMMARY
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Comment build URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = '${{ steps.eas-build.outputs.build_url }}';
            const profile  = '${{ steps.profile.outputs.name }}';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: `### Validator Mobile Build Submitted\n\n| Field | Value |\n|-------|-------|\n| **App** | VoteCapsule Validator |\n| **Profile** | ${profile} |\n| **Platform** | Android |\n| **Build URL** | ${buildUrl} |\n\n_Build started via EAS. Check the link above for status and artifacts._`
            });
