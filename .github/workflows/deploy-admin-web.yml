name: Deploy Admin Portal → votecapsule.yna.co.ke

# ============================================================
# FIXED: Previously pulled VITE_* env vars from repo secrets
# (VITE_IDENTITY_API_URL, VITE_TENANT_API_URL, etc.) which were
# not set, so the portal built with empty API URLs. Replaced with
# the same hardcoded values used successfully in deploy-portals.yml.
# CLOUDFRONT_DISTRIBUTION_ID secret replaced with the known dist
# ID E2J8YA2BP1UC1H (admin bucket: vote-capsule-public-web-*).
# ============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin-web/**'
      - 'packages/design-tokens/**'
      - 'packages/types/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Build & Deploy Admin Portal
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @vote-capsule/admin-web typecheck

      # FIXED: hardcoded API Gateway + Cognito values (same as deploy-portals.yml)
      # so the admin portal always builds against the live environment without
      # relying on secrets that were never populated.
      - name: Build Admin Portal
        run: pnpm --filter @vote-capsule/admin-web build
        env:
          VITE_API_GATEWAY_URL:     https://483uyy43nc.execute-api.us-east-1.amazonaws.com
          VITE_API_BASE_URL:        https://483uyy43nc.execute-api.us-east-1.amazonaws.com/api/v1
          VITE_COGNITO_USER_POOL_ID: us-east-1_i3N2tg34A
          VITE_COGNITO_CLIENT_ID:   3hi86ci06546ki038k6msmik0s
          VITE_COGNITO_REGION:      us-east-1
          NODE_ENV:                 production

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-admin-web-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      - name: Upload assets to S3 (long-lived cache)
        run: |
          aws s3 sync apps/admin-web/dist/ \
            s3://vote-capsule-public-web-683541453923/ \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --delete

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp apps/admin-web/dist/index.html \
            s3://vote-capsule-public-web-683541453923/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # FIXED: replaced ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} with the
      # known distribution ID for the admin portal bucket.
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2J8YA2BP1UC1H \
            --paths "/*"
          echo "✅ CloudFront cache invalidated (E2J8YA2BP1UC1H)"

      - name: Deployment summary
        run: |
          echo "✅ Admin Portal deployed to s3://vote-capsule-public-web-683541453923"
          echo "   CloudFront distribution: E2J8YA2BP1UC1H"
          echo "   URL: https://votecapsule.yna.co.ke"
