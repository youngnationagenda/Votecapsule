name: AWS Lambda — Deploy Function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Lambda function name (e.g. vote-capsule-receive-upload)'
        required: true
      package_type:
        description: 'Package type: Zip or Image'
        required: false
        default: 'Image'
        type: choice
        options:
          - Image
          - Zip
      image_tag:
        description: 'ECR image tag (for Image type). Defaults to latest commit SHA.'
        required: false
        default: ''

env:
  AWS_REGION:    us-east-1
  ECR_REGISTRY:  683541453923.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy-lambda:
    name: Deploy Lambda — ${{ github.event.inputs.function_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-lambda-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "tag=${TAG::8}" >> $GITHUB_OUTPUT

      - name: Deploy Lambda function (Image)
        if: github.event.inputs.package_type == 'Image'
        uses: aws-actions/aws-lambda-deploy@v1.1.2
        with:
          function-name: ${{ github.event.inputs.function_name }}
          package-type:  Image
          image-uri:     ${{ env.ECR_REGISTRY }}/vote-capsule/${{ github.event.inputs.function_name }}:${{ steps.tag.outputs.tag }}
          publish:       true

      - name: Deploy Lambda function (Zip)
        if: github.event.inputs.package_type == 'Zip'
        uses: aws-actions/aws-lambda-deploy@v1.1.2
        with:
          function-name:       ${{ github.event.inputs.function_name }}
          package-type:        Zip
          code-artifacts-dir:  dist
          handler:             index.handler
          runtime:             nodejs22.x
          publish:             true
          s3-bucket:           vote-capsule-public-web-683541453923

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name ${{ github.event.inputs.function_name }} \
            --region us-east-1 \
            --query 'Configuration.{State:State,LastModified:LastModified,Runtime:Runtime,MemorySize:MemorySize}' \
            --output table
