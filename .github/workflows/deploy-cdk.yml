name: Deploy CDK Stacks

# Fixed: added `master` to the push trigger branches.
# Previously only `main` was listed — pushes to `master`
# (the repo's default branch) never triggered CDK deploys.

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'infrastructure/cdk/**'

  workflow_dispatch:
    inputs:
      stack:
        description: 'CDK stack to deploy (leave empty for --all)'
        required: false
        default: ''

jobs:
  deploy-cdk:
    name: CDK Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version read from package.json "packageManager" field (pnpm@9.14.4)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-cdk-${{ github.run_id }}
          aws-region:        us-east-1
          audience:          sts.amazonaws.com

      - name: CDK Diff
        run: |
          cd infrastructure/cdk
          STACK="${{ github.event.inputs.stack }}"
          if [ -z "$STACK" ]; then
            pnpm cdk diff --all
          else
            pnpm cdk diff "$STACK"
          fi

      - name: CDK Deploy
        run: |
          cd infrastructure/cdk
          STACK="${{ github.event.inputs.stack }}"
          if [ -z "$STACK" ]; then
            pnpm cdk deploy --all --require-approval never
          else
            pnpm cdk deploy "$STACK" --require-approval never
          fi
