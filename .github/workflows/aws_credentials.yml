name: AWS Credentials — Verify OIDC Setup

on:
  workflow_dispatch:
  schedule:
    # Run daily at 06:00 UTC to catch credential/OIDC issues early
    - cron: '0 6 * * *'

jobs:
  verify-credentials:
    name: Verify AWS OIDC Credentials
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-verify-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify identity
        run: |
          echo "✅ AWS credentials configured successfully"
          aws sts get-caller-identity --output table
          echo ""
          echo "Checking ECR access..."
          aws ecr describe-repositories \
            --region us-east-1 \
            --query 'repositories[?contains(repositoryName,`vote-capsule`)].repositoryName' \
            --output table
          echo ""
          echo "Checking ECS cluster..."
          aws ecs describe-clusters \
            --clusters vote-capsule-services \
            --region us-east-1 \
            --query 'clusters[0].{name:clusterName,status:status,services:activeServicesCount,tasks:runningTasksCount}' \
            --output table
