name: AWS CodeGuru Reviewer — Code Quality Analysis

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/**'
      - 'packages/**'
  pull_request:
    branches:
      - master
      - main

jobs:
  codeguru-review:
    name: CodeGuru Security & Quality Review
    runs-on: ubuntu-latest
    permissions:
      id-token:        write
      contents:        read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::683541453923:role/vote-capsule-github-actions-role
          role-session-name: GitHubActions-codeguru-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Run CodeGuru Reviewer
        uses: aws-actions/codeguru-reviewer@v1.1
        with:
          s3_bucket:   vote-capsule-public-web-683541453923
          source_path: .
