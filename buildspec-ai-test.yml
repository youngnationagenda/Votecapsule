version: 0.2

# VoteCapsule — AI Service single build test
# Validates the ECR pull-through cache fix before full rebuild

env:
  variables:
    AWS_REGION: "us-east-1"
    ECR_REGISTRY: "683541453923.dkr.ecr.us-east-1.amazonaws.com"
    NODE_ALPINE: "683541453923.dkr.ecr.us-east-1.amazonaws.com/ecr-public/docker/library/node:22-alpine"

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - export SHORT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "SHA = $SHORT_SHA"
      - echo "=== Pre-warming node:22-alpine via pull-through cache ==="
      - docker pull $NODE_ALPINE
      - echo "=== node:22-alpine cached successfully ==="

  build:
    commands:
      - echo "--- Building ai-service ---"
      - docker pull $ECR_REGISTRY/vote-capsule/ai-service:latest 2>/dev/null || true
      - docker build
          --cache-from $ECR_REGISTRY/vote-capsule/ai-service:latest
          --build-arg SERVICE_PORT=3006
          --build-arg GIT_SHA=$CODEBUILD_RESOLVED_SOURCE_VERSION
          -t $ECR_REGISTRY/vote-capsule/ai-service:$SHORT_SHA
          -t $ECR_REGISTRY/vote-capsule/ai-service:latest
          -f services/ai/Dockerfile .
      - docker push $ECR_REGISTRY/vote-capsule/ai-service:$SHORT_SHA
      - docker push $ECR_REGISTRY/vote-capsule/ai-service:latest
      - echo "DONE ai-service ✅"

  post_build:
    commands:
      - echo "=== AI service build test PASSED ==="
      - echo "Pull-through cache working - safe to run full buildspec.yml ==="
      - aws ecs update-service --cluster vote-capsule-services --service vc-ai --force-new-deployment --region $AWS_REGION || true
